name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          release_version="${GITHUB_REF_NAME#v}"

          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

          if [ "$release_version" != "$package_version" ]; then
            echo "Release version $release_version does not match package version $package_version."
            exit 1
          fi

      - name: Verify release commit
        run: |
          git fetch origin +refs/heads/master:refs/remotes/origin/master --depth=1

          release_commit="$(git rev-parse HEAD)"
          master_commit="$(git rev-parse origin/master)"

          if [ "$release_commit" != "$master_commit" ]; then
            echo "Release tag must point at current origin/master."
            echo "Release commit: $release_commit"
            echo "Master commit: $master_commit"
            exit 1
          fi

      - name: Verify package version is unpublished
        run: |
          package_name="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")"
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published."
            exit 1
          fi

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
