name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag
        run: |
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          release_version="${GITHUB_REF_NAME#v}"

          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi

          if [ "$release_version" != "$package_version" ]; then
            echo "Release version $release_version does not match package version $package_version."
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public --provenance
