name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build --compile --target bun-darwin-arm64  ./bin/extole.js --outfile dist/extole-darwin-arm64
          bun build --compile --target bun-darwin-x64    ./bin/extole.js --outfile dist/extole-darwin-x64
          bun build --compile --target bun-linux-x64     ./bin/extole.js --outfile dist/extole-linux-x64
          bun build --compile --target bun-linux-arm64   ./bin/extole.js --outfile dist/extole-linux-arm64
          bun build --compile --target bun-windows-x64  ./bin/extole.js --outfile dist/extole-windows-x64.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/extole-darwin-arm64
            dist/extole-darwin-x64
            dist/extole-linux-x64
            dist/extole-linux-arm64
            dist/extole-windows-x64.exe

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-homebrew-tap.yml --ref "${{ github.ref_name }}"
