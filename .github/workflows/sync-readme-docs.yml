name: Sync docs to ReadMe

on:
  push:
    branches: [main]
    paths:
      - docs/extole-cli.md

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync to ReadMe
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}
          README_BRANCH: stable
          README_SLUG: extole-cli
          SOURCE_FILE: docs/extole-cli.md
        run: python scripts/sync-to-readme.py
