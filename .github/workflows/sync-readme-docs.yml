name: Sync README to ReadMe Docs

on:
  push:
    branches: [master]
    paths:
      - README.md

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync to ReadMe
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}
          README_BRANCH: 4.0.0_extole-ai-docs
          README_SLUG: extole-cli
        run: python scripts/sync-to-readme.py
